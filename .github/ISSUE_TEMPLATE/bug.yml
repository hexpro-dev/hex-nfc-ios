name: Bug report
description: Something is broken or misbehaving
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Device & iOS version
      placeholder: "iPhone 15 Pro, iOS 18.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hex NFC version
      description: Shown beside Version in the app's Settings, with the build number in brackets.
      placeholder: "e.g. 1.0.2"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Tag chip (if relevant)
      placeholder: "NTAG215, MIFARE Ultralight EV1, NTAG424 DNA, …"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app  2. Tap Scan  3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: On the error screen, open Diagnostics and copy the text inside it (tap it on a scan or Operations error, or press and hold to select it on a write error). Paste it here.
      render: text
