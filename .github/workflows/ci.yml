name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: app

jobs:
  lint:
    name: Lint & format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      # Pinned, not `brew install`. The runner image ships its own SwiftFormat
      # and `brew install` leaves that copy alone, so the version followed the
      # image: 0.63.1 arrived with the 20261013 image and disagrees with 0.63.0
      # about comments on local functions. Images roll out gradually, so on the
      # same day one job got 0.63.0 and the next 0.63.1, and lint passed or
      # failed by machine. Bump the version and the digest together; the digest
      # is the one GitHub publishes for the release's swiftformat.zip.
      - name: Install SwiftFormat
        env:
          SWIFTFORMAT_VERSION: "0.63.1"
          SWIFTFORMAT_SHA256: 385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: SwiftLint
        working-directory: ${{ env.APP_DIR }}
        run: swiftlint --strict --config ../.swiftlint.yml
      - name: SwiftFormat (lint mode)
        working-directory: ${{ env.APP_DIR }}
        run: |
          swiftformat --version
          swiftformat --lint --config ../.swiftformat .

  guards:
    name: Source-shape guards
    # Deliberately depends on nothing, for the same reason build-app does not:
    # whether someone reintroduced a parallel credential implementation is not
    # downstream of whether the imports are sorted, and a job that only runs
    # after lint is a job that stops running the moment lint drifts. It is also
    # not a step inside lint, because steps run in order and a SwiftLint failure
    # would skip it, which is precisely the coupling the comment on build-app
    # was written to remove.
    #
    # ubuntu, not macos: this is bash and awk over the source tree, it takes
    # well under a second, and nothing here needs Xcode or a Swift toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shipped-frames guard
        run: .github/scripts/check-shipped-frames.sh

  test:
    name: Test (SPM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh
      - name: Resolve packages
        working-directory: ${{ env.APP_DIR }}
        run: swift package resolve
      - name: Build (SPM)
        working-directory: ${{ env.APP_DIR }}
        run: swift build --configuration debug
      # The suite is platform-agnostic and runs on the macOS host. It used to be
      # a two-entry iOS matrix, which doubled the runtime and proved nothing:
      # both entries ran this exact command and the `destination` they set was
      # never passed to anything. Simulator coverage belongs in build-app.
      - name: Test (SPM)
        working-directory: ${{ env.APP_DIR }}
        run: swift test --parallel --enable-code-coverage
      - name: Coverage summary
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcrun llvm-cov report \
            .build/debug/HexNFCPackageTests.xctest/Contents/MacOS/HexNFCPackageTests \
            -instr-profile=.build/debug/codecov/default.profdata \
            -ignore-filename-regex='Tests|\.build|Package\.swift' || true

  build-app:
    name: Build app target
    runs-on: macos-latest
    # Deliberately depends on nothing. This used to be `needs: [lint, test]`,
    # which meant a style violation anywhere skipped the only job that compiles
    # a `#if os(iOS)` file at all: swift build on the macOS host does not read
    # ScanSheet, OperationsSheet, AdvancedConsoleSheet, LibrarySheet or
    # CoreNFCSession. Lint drifted, this was skipped with it, and the iOS
    # sources went unbuilt on CI for as long as that lasted. Whether the app
    # compiles is not downstream of whether the imports are sorted, so the two
    # now fail independently and each says what it means.
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh
      - name: Build for iOS Simulator (no signing)
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcodebuild \
            -project HexNFC.xcodeproj \
            -scheme HexNFC \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
